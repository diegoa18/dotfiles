general {
    hide_cursor = true
    disable_loading_bar = true
}

background {
    monitor =
    path = ~/Pictures/wallpaper/current

    blur_passes = 2
    blur_size = 4

    brightness = 0.60
    contrast = 0.90
}

label {
    monitor =
    text = $TIME
    font_size = 48
    color = rgba(ffffffee)
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    font_size = 18
    color = rgba(ffffffff)
    position = 0, 60
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 55

    outline_thickness = 1
    outer_color = rgba(ffffffff)
    inner_color = rgba(00000000)

    font_color = rgba(ffffffff)

    fade_on_empty = false
    placeholder_text =

    position = 0, -30
    halign = center
    valign = center
}

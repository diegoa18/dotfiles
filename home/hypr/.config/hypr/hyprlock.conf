general {
	hide_cursor = true
	disable_loading_bar = true
}

background {
	monitor =
	path = ~/Pictures/wallpaper/current

	blur_passes = 2
	blur_size = 4

	brightness = 0.60
	contrast = 0.90
}

label {
	monitor =
	text = $TIME
	font_family = JetBrains Mono
	font_size = 64
	color = rgb(cdd6f4)
	position = 0, 120
	halign = center
	valign = center
}

label {
	monitor =
	text = $USER
	font_family = JetBrains Mono
	font_size = 18
	color = rgb(bac2de)
	position = 0, 60
	halign = center
	valign = center
}

input-field {
	monitor =
	size = 300, 50
	rounding = 10

	outline_thickness = 2
	outer_color = rgb(89b4fa)
	inner_color = rgba(8, 8, 8, 0.7)
	font_color = rgb(cdd6f4)
	check_color = rgb(a6e3a1)
	fail_color = rgb(f38ba8)

	fade_on_empty = false
	placeholder_text = <span foreground="##bac2de">Password...</span>

	position = 0, -30
	halign = center
	valign = center
}

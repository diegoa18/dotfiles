general {
    hide_cursor = true
    disable_loading_bar = true
}

background {
    monitor =
    path = ~/Pictures/wallpaper/current

    blur_passes = 2
    blur_size = 4

    brightness = 0.60
    contrast = 0.90
}

label {
    monitor =
    text = $TIME
    font_family = sans-serif
    font_size = 64
    color = rgb(cad3f5)
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    font_family = sans-serif
    font_size = 18
    color = rgb(b8c0e0)
    position = 0, 60
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 50

    outline_thickness = 2
    outer_color = rgb(8aadf4)
    inner_color = rgba(8, 8, 8, 0.7)
    font_color = rgb(cad3f5)
    check_color = rgb(a6da95)
    fail_color = rgb(ed8796)

    fade_on_empty = false
    placeholder_text = <span foreground="##b8c0e0">Password...</span>

    position = 0, -30
    halign = center
    valign = center
}
